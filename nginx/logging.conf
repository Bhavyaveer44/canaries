# Loaded before default.conf (00- prefix sorts first). log_format must
# be defined once at http context before any access_log using it -
# conf.d/*.conf files are all included inside the http block by
# nginx's default nginx.conf, so this works as a sibling file.
log_format canary_fmt '$time_iso8601 upstream=$upstream_addr status=$status';
access_log /var/log/nginx/canary.log canary_fmt;
